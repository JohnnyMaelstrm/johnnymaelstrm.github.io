<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Threat Intel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #09090b;        
            --header-bg: rgba(255, 255, 255, 0.02);       
            --border-color: rgba(255, 255, 255, 0.08);    
            --text-primary: #d4d4d8;    
            --text-secondary: #a1a1aa;  
            --accent-green: #22c55e;
            --accent-red: #ff7b72;
            --accent-blue: #58a6ff;
            --accent-purple: #d2a8ff;
            --accent-orange: #d19a66;
            --cmd-color: #a5d6ff;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; 
            display: flex;           
            flex-direction: column;
            height: 100vh;
        }

        /* --- CHART SECTION --- */
        .chart-container {
            height: 120px; /* Korkeus kuvaajalle */
            width: 100%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px;
            position: relative;
        }

        /* --- TERMINAL SECTION --- */
        .terminal-window {
            display: flex;
            flex-direction: column;
            flex: 1;                 
            min-height: 0;
        }

        .header {
            background-color: var(--bg-color); /* Erotetaan graafista */
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .title {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            display: flex; align-items: center; gap: 8px;
        }
        
        .title::before {
            content: ">_";
            color: var(--accent-green);
            font-weight: bold;
        }

        .live-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 10px; color: var(--accent-green); font-weight: 600;
            text-transform: uppercase;
        }
        .pulse-dot {
            width: 6px; height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); 
            animation: pulse 2s infinite ease-in-out;
        }

        .terminal-content {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
        }

        /* Logs */
        .log-entry {
            display: grid;
            grid-template-columns: 65px 100px 140px 1fr; 
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 3px 0;
            align-items: start;
        }
        .time { color: var(--text-secondary); }
        .ip-cell { display: flex; align-items: center; gap: 6px; }
        .ip { color: var(--accent-purple); font-weight: 500; }
        .flag { font-size: 1.1em; opacity: 0.9; }
        .user { color: var(--accent-blue); }
        .pass { color: var(--text-secondary); font-style: italic; opacity: 0.7; }
        .cmd { color: var(--cmd-color); font-weight: 500; letter-spacing: -0.5px;}
        
        .badge { font-weight: 600; letter-spacing: 0.5px; font-size: 10px; }
        .badge-cmd { color: var(--accent-blue); }
        .badge-breach { color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 123, 114, 0.2); }
        .badge-fail { color: var(--accent-orange); }

        .status-line {
            margin-bottom: 10px; padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-secondary); font-style: italic; font-size: 10px;
        }
        .cursor {
            display: inline-block; width: 6px; height: 12px;
            background-color: var(--accent-blue);
            vertical-align: middle; margin-left: 6px;
            animation: blink 1s step-end infinite;
        }

        .summary-text {
            padding: 8px 12px;
            color: var(--text-secondary); font-size: 10px; text-align: center;
            background-color: var(--bg-color); border-top: 1px solid var(--border-color);
            line-height: 1.4; flex-shrink: 0; 
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        @media (max-width: 600px) {
            .chart-container { display: none; } /* Hide chart on mobile to save space */
            .log-entry { grid-template-columns: 60px 1fr; grid-template-areas: "time status" "ip ip" "details details"; gap: 2px; padding: 8px 0; }
            .time { grid-area: time; } .badge { grid-area: status; text-align: right; }
            .ip-cell { grid-area: ip; } .details { grid-area: details; }
        }
    </style>
</head>
<body>

    <!-- GRAPH SECTION -->
    <div class="chart-container">
        <canvas id="attackChart"></canvas>
    </div>

    <!-- TERMINAL SECTION -->
    <div class="terminal-window">
        <div class="header">
            <div class="header-left">
                <div class="title">🛡 Honeypot Attacks (Live Data)</div>
            </div>
            <div class="live-status">
                <div class="pulse-dot"></div> Live
            </div>
        </div>
        
        <div class="terminal-content" id="terminal-logs">
            <div class="status-line">
                Establishing uplink to sensor node...<span class="cursor"></span>
            </div>
        </div>
    </div>

   <div class="summary-text">
        This feed captures live attacks on my private honeypot in Cloud! The chart shows how many attacks are per hour. <br>
        All data is sanitized (IPs masked, payloads hidden) for responsible disclosure (GDPR).
    </div>

    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/JohnnyMaelstrm/264b6727308ea84e7f447e21b2b466ae/raw/attacks.json'; 
        let attackChart = null; // Store chart instance

        function getFlagEmoji(countryCode) {
            if (!countryCode || countryCode === 'UNK') return '🌐'; 
            return countryCode.toUpperCase().replace(/./g, char => 
                String.fromCodePoint(char.charCodeAt(0) + 127397)
            );
        }

        function initChart(dataPoints) {
            const ctx = document.getElementById('attackChart').getContext('2d');
            
            // Create labels for last 24h (e.g., "-24h", "-23h"...)
            const labels = Array.from({length: 24}, (_, i) => i === 23 ? 'Now' : `-${23-i}h`);

            if (attackChart) {
                attackChart.data.datasets[0].data = dataPoints;
                attackChart.update();
                return;
            }

            attackChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Attacks / Hour',
                        data: dataPoints,
                        borderColor: '#22c55e', // Green
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        borderWidth: 2,
                        tension: 0.3, // Smooth curves
                        fill: true,
                        pointRadius: 0,
                        pointHitRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: '#161b22',
                            titleColor: '#8b949e',
                            bodyColor: '#d4d4d8',
                            borderColor: '#30363d',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: { 
                            display: false // Hide X axis labels for clean look
                        },
                        y: {
                            display: true,
                            grid: { color: '#30363d', drawBorder: false },
                            ticks: { color: '#8b949e', font: { size: 9 } },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        async function fetchLogs() {
            const container = document.getElementById('terminal-logs');
            
            try {
                const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Connection failed');
                
                const json = await response.json();
                
                // --- HANDLE DATA STRUCTURE CHANGE ---
                let logs = [];
                let chartData = Array(24).fill(0); 

                if (Array.isArray(json)) {
                    logs = json; // Old format
                } else {
                    logs = json.logs;
                    chartData = json.chart_data;
                }

                // Render Chart
                initChart(chartData);

                // Render Logs
                container.innerHTML = ''; 
                const status = document.createElement('div');
                status.className = 'status-line';
                status.innerHTML = 'Monitoring active session...<span class="cursor"></span>';
                container.appendChild(status);

                logs.forEach(item => {
                    if (item.type === 'SUCCESSFUL BREACH') return;

                    const dateObj = new Date(item.timestamp);
                    const timeStr = dateObj.toLocaleTimeString('en-GB', { hour12: false });
                    const flag = getFlagEmoji(item.country);

                    let statusHtml = '', detailsHtml = '';

                    if (item.type === 'CMD_EXEC') {
                        statusHtml = `<span class="badge badge-cmd">EXEC_CMD</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> <span style="color:#666">$</span> <span class="cmd">${item.password}</span></span>`;
                    } else if (item.type === 'SYSTEM_BREACH') {
                        statusHtml = `<span class="badge badge-breach">BREACH</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> status:<span style="color:#ff7b72">ACCESS_LOGGED</span></span>`;
                    } else {
                        statusHtml = `<span class="badge badge-fail">AUTH_FAIL</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> pass:<span class="pass">${item.password}</span></span>`;
                    }

                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.innerHTML = `
                        <div class="time">${timeStr}</div>
                        <div class="status">${statusHtml}</div>
                        <div class="ip-cell"><span class="flag">${flag}</span> <span class="ip">${item.src_ip}</span></div>
                        ${detailsHtml}
                    `;
                    container.appendChild(row);
                });

            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Aggressively unregister Service Workers to fix Chirpy caching
            // WRAPPED IN TRY-CATCH to prevent InvalidStateError
            if ('serviceWorker' in navigator) {
                try {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        } 
                    }).catch(function(err) {
                        console.log('SW cleanup skipped (non-fatal)');
                    });
                } catch (e) {
                    console.log('SW cleanup skipped (non-fatal)');
                }
            }
            
            fetchLogs();
            setInterval(fetchLogs, 30000);
        });
    </script>
</body>
</html>
