<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Threat Intel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL TERMINAL THEME (Matched to Portfolio) --- */
        :root {
            --bg-color: #09090b;        
            --header-bg: rgba(255, 255, 255, 0.02);       
            --border-color: rgba(255, 255, 255, 0.08);    
            --text-primary: #d4d4d8;    
            --text-secondary: #a1a1aa;  
            
            --accent-red: #ff7b72;      /* Breaches/Errors */
            --accent-green: #22c55e;    /* Success/Live */
            --accent-blue: #58a6ff;     /* Users */
            --accent-purple: #d2a8ff;   /* IPs */
            --accent-orange: #d19a66;   /* Warnings */
            --cmd-color: #a5d6ff;       /* Commands */
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; 
            display: flex;           
            flex-direction: column;
            height: 100vh;
        }

        .terminal-window {
            display: flex;
            flex-direction: column;
            flex: 1;                 
            min-height: 0;           
            border-bottom: 1px solid var(--border-color); 
        }

        .header {
            background-color: var(--header-bg);
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .title {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .title::before {
            content: ">_";
            color: var(--accent-green);
            font-weight: bold;
            margin-right: 4px;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--accent-green);
            font-weight: 600;
            text-transform: uppercase;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); 
            animation: pulse 2s infinite ease-in-out;
        }

        .terminal-content {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
        }

        /* Grid Layout */
        .log-entry {
            display: grid;
            /* Time | Status | IP (with flag) | Details */
            grid-template-columns: 65px 100px 140px 1fr; 
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 3px 0;
            align-items: start;
        }
        .log-entry:last-child { border-bottom: none; }

        .time { color: var(--text-secondary); }
        .ip-cell { display: flex; align-items: center; gap: 6px; }
        .ip { color: var(--accent-purple); font-weight: 500; }
        .flag { font-size: 1.1em; opacity: 0.9; }
        
        .user { color: var(--accent-blue); }
        .pass { color: var(--text-secondary); font-style: italic; opacity: 0.7; }
        .cmd { color: var(--cmd-color); font-weight: 500; letter-spacing: -0.5px;}
        
        .badge { font-weight: 600; letter-spacing: 0.5px; font-size: 10px; }
        .badge-cmd { color: var(--accent-blue); }
        .badge-breach { color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 123, 114, 0.2); }
        .badge-fail { color: var(--accent-orange); }

        .status-line {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-secondary);
            font-style: italic;
            font-size: 10px;
        }
        .cursor {
            display: inline-block;
            width: 6px;
            height: 12px;
            background-color: var(--accent-blue);
            vertical-align: middle;
            margin-left: 6px;
            animation: blink 1s step-end infinite;
        }

        .summary-text {
            padding: 10px 12px;
            color: var(--text-secondary);
            font-size: 10px;
            text-align: center;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            line-height: 1.4;
            flex-shrink: 0; 
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        @media (max-width: 600px) {
            .log-entry {
                grid-template-columns: 60px 1fr; 
                grid-template-areas: 
                    "time status"
                    "ip ip"
                    "details details";
                gap: 2px;
                padding: 8px 0;
            }
            .time { grid-area: time; }
            .badge { grid-area: status; text-align: right; }
            .ip-cell { grid-area: ip; font-size: 11px; opacity: 0.8; }
            .details { grid-area: details; margin-top: 2px; }
        }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="header">
            <div class="header-left">
                <div class="title">🛡 Honeypot Attacks (Live Data)
</div>
            </div>
            <div class="live-status">
                <div class="pulse-dot"></div> Live
            </div>
        </div>
        
        <div class="terminal-content" id="terminal-logs">
            <div class="status-line">
                Establishing uplink to sensor node...<span class="cursor"></span>
            </div>
        </div>
    </div>

    <div class="summary-text">
        This feed captures live attacks on my private honeypot in Linode. <br>
        All data is sanitized (IPs masked, payloads hidden) for responsible disclosure.
    </div>

    <script>
        // Use your LIVE URL (no commit hash) so new data flows in automatically
        const GIST_URL = 'https://gist.githubusercontent.com/JohnnyMaelstrm/264b6727308ea84e7f447e21b2b466ae/raw/attacks.json'; 

        // Helper: Convert "US" -> 🇺🇸
        function getFlagEmoji(countryCode) {
            if (!countryCode || countryCode === 'UNK') return '🌐'; 
            return countryCode.toUpperCase().replace(/./g, char => 
                String.fromCodePoint(char.charCodeAt(0) + 127397)
            );
        }

        async function fetchLogs() {
            const container = document.getElementById('terminal-logs');
            
            try {
                const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Connection failed');
                
                const data = await response.json();
                container.innerHTML = ''; 

                // Cursor at Top
                const status = document.createElement('div');
                status.className = 'status-line';
                status.innerHTML = 'Monitoring active session...<span class="cursor"></span>';
                container.appendChild(status);

                data.forEach(item => {
                    const dateObj = new Date(item.timestamp);
                    const timeStr = dateObj.toLocaleTimeString('en-GB', { hour12: false });
                    const flag = getFlagEmoji(item.country);

                    let statusHtml = '';
                    let detailsHtml = '';

                    // 1. Command Execution (Blue)
                    if (item.type === 'CMD_EXEC') {
                        statusHtml = `<span class="badge badge-cmd">EXEC_CMD</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> <span style="color:#666">$</span> <span class="cmd">${item.password}</span></span>`;
                    
                    // 2. System Breach (Red) - Showing sanitized notification
                    } else if (item.type === 'SYSTEM_BREACH') {
                        statusHtml = `<span class="badge badge-breach">BREACH</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> status:<span style="color:#ff7b72">ACCESS_LOGGED</span></span>`;

                    // 3. Failed Login (Orange)
                    } else {
                        statusHtml = `<span class="badge badge-fail">AUTH_FAIL</span>`;
                        detailsHtml = `<span class="details">user:<span class="user">${item.username}</span> pass:<span class="pass">${item.password}</span></span>`;
                    }

                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.innerHTML = `
                        <div class="time">${timeStr}</div>
                        <div class="status">${statusHtml}</div>
                        <div class="ip-cell"><span class="flag">${flag}</span> <span class="ip">${item.src_ip}</span></div>
                        ${detailsHtml}
                    `;
                    container.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="color:#ff7b72; padding:10px;">// CONNECTION ERROR: ${err.message}</div>`;
            }
        }

        fetchLogs();
        setInterval(fetchLogs, 30000);
    </script>

</body>
</html>
