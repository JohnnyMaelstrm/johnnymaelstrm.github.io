<script>
const GIST_ID = "264b6727308ea84e7f447e21b2b466ae";    // <-- SINUN GIST ID
const FILE_NAME = "attacks.json";                       // <-- SINUN tiedoston nimi
const API_URL = `https://api.github.com/gists/${GIST_ID}`;

async function loadLogs() {
    try {
        const response = await fetch(API_URL + "?cache=" + Date.now());
        const data = await response.json();

        const file = data.files[FILE_NAME];
        if (!file) {
            document.getElementById("honeypot-log").innerText =
                "ERROR: Gist file '" + FILE_NAME + "' not found.";
            return;
        }

        // Replace content
        const logElement = document.getElementById("honeypot-log");
        logElement.innerText = file.content;

        // Auto-scroll to bottom
        logElement.scrollTop = logElement.scrollHeight;

    } catch (err) {
        console.error(err);
        document.getElementById("honeypot-log").innerText = 
            "ERROR: Could not load live threat feed.";
    }
}

// Load immediately + refresh each 5 seconds
loadLogs();
setInterval(loadLogs, 5000);
</script>
