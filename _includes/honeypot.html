<div class="hp-container">
    <div class="hp-header">
        <span class="hp-dot red"></span>
        <span class="hp-dot yellow"></span>
        <span class="hp-dot green"></span>
        <span class="hp-title">🔴 LIVE THREAT INTEL (COWRIE)</span>
    </div>
    <div class="hp-terminal" id="honeypot-log">
        <span class="hp-cursor">Initializing uplink to secure server...</span>
    </div>
    <div class="hp-footer">
        Data source: <a href="https://github.com/JohnnyMaelstrm" target="_blank">Private VPS Node</a>
    </div>
</div>

<style>
/* Force Dark Mode for Terminal regardless of Theme */
.hp-container {
    background: #101010;
    border: 1px solid #333;
    border-radius: 8px;
    margin: 2rem 0;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    overflow: hidden;
}

.hp-header {
    background: #1f1f1f;
    padding: 8px 12px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
}

.hp-dot {
    height: 10px;
    width: 10px;
    border-radius: 50%;
    margin-right: 6px;
    display: inline-block;
}
.red { background-color: #ff5f56; }
.yellow { background-color: #ffbd2e; }
.green { background-color: #27c93f; }

.hp-title {
    color: #888;
    font-size: 0.75rem;
    margin-left: 10px;
    font-weight: bold;
    letter-spacing: 1px;
}

.hp-terminal {
    padding: 15px;
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    color: #33ff00; /* Hacker Green */
    font-size: 0.85rem;
    line-height: 1.4;
}

.hp-footer {
    padding: 5px 15px;
    background: #1f1f1f;
    border-top: 1px solid #333;
    font-size: 0.7rem;
    color: #666;
    text-align: right;
}

/* Custom log styling */
.hp-entry { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
.hp-time { color: #666; margin-right: 8px; }
.hp-ip { color: #ff5555; font-weight: bold; }
.hp-user { color: #50fa7b; }
.hp-pass { color: #f1fa8c; font-style: italic; }

/* Blink animation */
@keyframes blink { 50% { opacity: 0; } }
.hp-cursor { animation: blink 1s step-start infinite; }
</style>

<script>
    // --- DEBUG MODE ---
    // Try using the URL EXACTLY as it appears when you click "Raw" in your browser
    const GIST_URL = 'https://gist.githubusercontent.com/JohnnyMaelstrm/264b6727308ea84e7f447e21b2b466ae/raw/attacks.json'; 

    async function fetchHoneypotData() {
        const container = document.getElementById('honeypot-log');
        
        try {
            console.log("Fetching from:", GIST_URL);
            
            // Fetch with cache busting
            const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
            
            if (!response.ok) {
                // PRINT THIS ERROR TO THE SCREEN
                throw new Error(`HTTP Error: ${response.status} (Page not found?)`);
            }
            
            const text = await response.text(); // Get text first to check if it's HTML
            
            try {
                var data = JSON.parse(text); // Try to parse as JSON
            } catch (e) {
                throw new Error("Received HTML instead of JSON. Check your URL!");
            }

            container.innerHTML = ''; 

            data.forEach(attack => {
                const dateObj = new Date(attack.timestamp);
                const timeStr = dateObj.toLocaleTimeString();

                const html = `
                    <div class="hp-entry">
                        <span class="hp-time">[${timeStr}]</span>
                        INTRUSION: <span class="hp-ip">${attack.src_ip}</span><br>
                        User: <span class="hp-user">${attack.username}</span> 
                        // <span class="hp-pass">${attack.password}</span>
                    </div>
                `;
                container.innerHTML += html;
            });

        } catch (error) {
            console.error(error);
            // This puts the error right on your webpage so you can see it
            container.innerHTML = `<p style="color:red; font-weight:bold;">// ERROR: ${error.message}</p>`;
        }
    }

    fetchHoneypotData();
</script>
